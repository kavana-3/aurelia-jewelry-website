<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | AURELIA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <a href="index.html" class="logo">
        <img src="C:\Users\kamadhenu BCA\Desktop\kavanas\kw.png"
             class="logo-image"
             alt="AURELIA Logo">

        <span class="logo-text">
            <span class="logo-name">AURELIA</span>
            <span class="logo-sub">HOUSE OF JEWELS</span>
        </span>
    </a>

    <nav class="main-nav">
        <a href="index.html">HOME</a>
        <a href="collections.html">COLLECTIONS</a>
        <a href="about.html">ABOUT US</a>
        <a href="contact.html">CONTACT</a>
    </nav>

</header>


<main class="contact-page">

    <div class="contact-layout">

        <div class="contact-intro">

            <p class="eyebrow">AURELIA JEWELLERY</p>

            <h1>
                Place Your Order
            </h1>

            <p>
                Fill in your details and our team will
                get in touch with you regarding your
                selected jewellery.
            </p>

        </div>


        <form id="orderForm" class="contact-form">

            <div class="form-group">

                <label for="productName">
                    Product Name
                </label>

                <input type="text"
                       id="productName"
                       name="product"
                       placeholder="Enter product name">

            </div>


            <div class="form-group">

                <label for="name">
                    Your Name
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your name"
                       required>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           required>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           placeholder="Enter phone number"
                           required>

                </div>

            </div>


            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea id="address"
                          name="address"
                          placeholder="Enter your address"
                          required></textarea>

            </div>


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea id="message"
                          name="message"
                          placeholder="Any additional message"></textarea>

            </div>


            <p id="formError"
               class="form-error">
            </p>


            <button type="submit"
                    class="primary-button">
                PLACE ORDER
            </button>


            <div id="successMessage"
                 class="success-message">

                Congratulations! You have got this product.

            </div>

        </form>

    </div>

</main>


<footer class="site-footer">
    <p>© 2026 AURELIA HOUSE OF JEWELS</p>
</footer>


<script>

const params =
    new URLSearchParams(window.location.search);

const product =
    params.get("product");

const productName =
    document.getElementById("productName");


if (product) {

    productName.value = product;

}


document.getElementById("orderForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const formError =
        document.getElementById("formError");

    const successMessage =
        document.getElementById("successMessage");


    if (productName.value.trim() === "") {

        formError.innerText =
            "Please enter the product name.";

        successMessage.style.display = "none";

        productName.focus();

        return;

    }


    if (!this.checkValidity()) {

        formError.innerText =
            "Please fill in all required details.";

        successMessage.style.display = "none";

        this.reportValidity();

        return;

    }


    formError.innerText = "";

    successMessage.style.display = "block";

});


</script>

</body>
</html>
